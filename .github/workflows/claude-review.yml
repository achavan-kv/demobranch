name: Claude PR Review

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: read
  pull-requests: write

jobs:
  claude-review:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate PR Diff
        run: |
          git fetch origin ${{ github.event.pull_request.base.ref }}

          git diff \
            origin/${{ github.event.pull_request.base.ref }}...HEAD \
            -- '*.cs' '*.csproj' '*.json' '*.yml' '*.yaml' '*.sql' \
            > pr.diff

          echo "Diff generated"

      - name: Review PR with Claude
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |

          DIFF_CONTENT=$(head -c 120000 pr.diff)

          jq -n \
            --arg diff "$DIFF_CONTENT" \
            '{
              model: "claude-3-5-sonnet-20241022",
              max_tokens: 2000,
              messages: [
                {
                  role: "user",
                  content:
                  "You are an expert .NET and SQL enterprise code reviewer.\n\nReview the following pull request diff carefully.\n\nFocus on:\n- C# coding standards\n- SOLID principles\n- ASP.NET Core best practices\n- SQL query optimization\n- SQL injection vulnerabilities\n- Stored procedure best practices\n- Transaction handling\n- EF Core optimization\n- Async/await issues\n- Exception handling\n- Logging gaps\n- Memory leaks\n- Security vulnerabilities\n- Maintainability\n- Possible production bugs\n- Code readability\n\nProvide concise actionable recommendations with severity levels (Critical, High, Medium, Low).\n\nPR Diff:\n\n" + $diff
                }
              ]
            }' > request.json

          curl https://api.anthropic.com/v1/messages \
            --silent \
            --request POST \
            --header "x-api-key: $ANTHROPIC_API_KEY" \
            --header "anthropic-version: 2023-06-01" \
            --header "content-type: application/json" \
            --data @request.json \
            > review.json

          echo "Claude response received"

          COMMENT=$(jq -r '.content[0].text // "No review comments generated."' review.json)

          echo "COMMENT<<EOF" >> $GITHUB_ENV
          echo "$COMMENT" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      - name: Post PR Comment
        uses: actions/github-script@v7
        env:
          COMMENT: ${{ env.COMMENT }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `## Claude AI Review\n\n${process.env.COMMENT}`
            });
