name: Claude PR Review

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: read
  pull-requests: write

jobs:
  claude-review:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get PR diff
        id: diff
        run: |
          git fetch origin ${{ github.event.pull_request.base.ref }}

          git diff \
            origin/${{ github.event.pull_request.base.ref }}...HEAD \
            > pr.diff

          echo "DIFF<<EOF" >> $GITHUB_ENV
          cat pr.diff >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      - name: Review PR with Claude
        id: claude
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          REVIEW=$(curl https://api.anthropic.com/v1/messages \
            --silent \
            --request POST \
            --header "x-api-key: $ANTHROPIC_API_KEY" \
            --header "anthropic-version: 2023-06-01" \
            --header "content-type: application/json" \
            --data "$(jq -n \
              --arg diff "$DIFF" \
              '{
                model: "claude-3-5-sonnet-20241022",
                max_tokens: 2000,
                messages: [
                  {
                    role: "user",
                    content:
                      "You are a senior .NET code reviewer.\n\nReview this pull request diff carefully.\n\nFocus on:\n- C# best practices\n- ASP.NET Core patterns\n- Performance issues\n- Security vulnerabilities\n- Clean architecture\n- SOLID principles\n- Entity Framework issues\n- Async/await misuse\n- Logging and exception handling\n- Possible bugs\n- Code readability\n\nProvide concise actionable feedback.\n\nGit diff:\n\n" + $diff
                  }
                ]
              }')" )

          echo "$REVIEW" > review.json

          COMMENT=$(cat review.json | jq -r '.content[0].text')

          echo "COMMENT<<EOF" >> $GITHUB_ENV
          echo "$COMMENT" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      - name: Post review comment
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const body = process.env.COMMENT;

            github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `## Claude AI Code Review\n\n${body}`
            });
