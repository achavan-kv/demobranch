name: Claude PR Review

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: read
  pull-requests: write

jobs:
  claude-review:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate PR Diff
        run: |
          git fetch origin ${{ github.event.pull_request.base.ref }}

          git diff origin/${{ github.event.pull_request.base.ref }}...HEAD -- '*.cs' '*.csproj' '*.json' '*.yml' '*.yaml' '*.sql' > pr.diff

      - name: Create Claude Request JSON
        run: |
          echo '{
            "model": "claude-3-5-sonnet-20241022",
            "max_tokens": 2000,
            "messages": [
              {
                "role": "user",
                "content": "Review this .NET and SQL pull request diff for coding standards, SOLID principles, ASP.NET Core best practices, SQL optimization, security vulnerabilities, EF Core issues, async/await issues, exception handling, logging gaps, maintainability, and possible production bugs.\n\nPR Diff:\n\n'"$(sed 's/"/\\"/g' pr.diff | tr '\n' ' ')"'"
              }
            ]
          }' > request.json

      - name: Call Claude API
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          curl https://api.anthropic.com/v1/messages \
            --silent \
            --request POST \
            --header "x-api-key: $ANTHROPIC_API_KEY" \
            --header "anthropic-version: 2023-06-01" \
            --header "content-type: application/json" \
            --data @request.json \
            > review.json

          cat review.json

      - name: Extract Claude Review
        run: |
          python3 -c "
import json

with open('review.json', 'r') as f:
    data = json.load(f)

comment = 'No review generated.'

if 'content' in data:
    comment = data['content'][0]['text']

with open('comment.txt', 'w') as f:
    f.write(comment)
"

      - name: Post PR Comment
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');

            const comment = fs.readFileSync('comment.txt', 'utf8');

            github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `## Claude AI Review\n\n${comment}`
            });
