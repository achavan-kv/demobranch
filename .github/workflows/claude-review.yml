name: Claude PR Review

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: read
  pull-requests: write

jobs:
  claude-review:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate PR Diff
        run: |
          git fetch origin ${{ github.event.pull_request.base.ref }}

          git diff origin/${{ github.event.pull_request.base.ref }}...HEAD \
            -- '*.cs' '*.csproj' '*.json' '*.yml' '*.yaml' '*.sql' \
            > pr.diff

          echo "Diff generated"

      - name: Create Claude Request
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          python3 - << 'PYTHON'
          import json

          with open("pr.diff", "r", encoding="utf-8") as f:
              diff = f.read()[:100000]

          prompt = f"""
You are an expert .NET and SQL enterprise code reviewer.

Review the following pull request diff carefully.

Focus on:
- C# coding standards
- SOLID principles
- ASP.NET Core best practices
- SQL query optimization
- SQL injection vulnerabilities
- Stored procedure best practices
- Transaction handling
- EF Core optimization
- Async/await issues
- Exception handling
- Logging gaps
- Memory leaks
- Security vulnerabilities
- Maintainability
- Possible production bugs
- Code readability

Provide concise actionable recommendations with severity levels (Critical, High, Medium, Low).

PR Diff:

{diff}
"""

          body = {
              "model": "claude-3-5-sonnet-20241022",
              "max_tokens": 2000,
              "messages": [
                  {
                      "role": "user",
                      "content": prompt
                  }
              ]
          }

          with open("request.json", "w", encoding="utf-8") as f:
              json.dump(body, f)
          PYTHON

      - name: Call Claude API
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          curl https://api.anthropic.com/v1/messages \
            --silent \
            --request POST \
            --header "x-api-key: $ANTHROPIC_API_KEY" \
            --header "anthropic-version: 2023-06-01" \
            --header "content-type: application/json" \
            --data @request.json \
            > review.json

          cat review.json

      - name: Extract Review Comment
        run: |
          python3 - << 'PYTHON'
          import json

          with open("review.json", "r", encoding="utf-8") as f:
              data = json.load(f)

          comment = "No review comments generated."

          if "content" in data:
              comment = data["content"][0]["text"]

          with open("comment.txt", "w", encoding="utf-8") as f:
              f.write(comment)
          PYTHON

      - name: Post PR Comment
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const comment = fs.readFileSync('comment.txt', 'utf8');

            github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `## Claude AI Review\n\n${comment}`
            });
